name: "Опубликовать новость"
description: "Тестовая публикация для PWA Маркообразные Новосибирск. Первую версию проверяем через GitHub Issues."
title: "[НОВОСТЬ] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Тестовый редактор
        Заполните новость. Изображение можно перетащить или прикрепить в поле текста (на компьютере и поддерживаемых мобильных браузерах).
        Для теста новости автоматически появляются, если их создаёт владелец kiberdoker-pixel. Новости от других пользователей показываются только после проверки и добавления метки published владельцем или редактором репозитория.
        Не указывайте личные данные или пароли: репозиторий станет публичным.
  - type: textarea
    id: news
    attributes:
      label: "Текст новости"
      description: "Сюда можно добавить фото через GitHub — оно появится в приложении."
      placeholder: "Что нового у клуба?"
    validations:
      required: true
