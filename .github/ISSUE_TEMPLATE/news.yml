name: "Опубликовать новость"
description: "Добавить новость и фотографии в приложение Маркообразные Новосибирск"
title: "[НОВОСТЬ] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Тестовый редактор
        Заполните новость. Изображение можно перетащить или прикрепить в поле текста (на компьютере и поддерживаемых мобильных браузерах).
        Новости утверждённых клубных редакторов публикуются автоматически после заполнения формы. Для остальных авторов новости видны в приложении только после одобрения владельцем (метка published). Чтобы получать права редактора, требуется сообщить владельцу точный логин GitHub.
        Не указывайте личные данные или пароли: репозиторий станет публичным.
  - type: textarea
    id: news
    attributes:
      label: "Текст новости"
      description: "Сюда можно добавить фото через GitHub — оно появится в приложении."
      placeholder: "Что нового у клуба?"
    validations:
      required: true
