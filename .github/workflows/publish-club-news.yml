name: Publish news from approved club editors

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  approve-news:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish trusted author's news
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!/^\[НОВОСТЬ\]\s+\S+/i.test(issue.title || '')) {
              core.info('Not a club news issue.');
              return;
            }

            const file = await github.rest.repos.getContent({
              ...context.repo,
              path: '.github/content-editors.json'
            });
            if (!('content' in file.data)) throw new Error('Invalid editor list');
            const config = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
            const approved = new Set((config.publishers || []).map(login => String(login).toLowerCase()));
            const author = (issue.user?.login || '').toLowerCase();
            if (!approved.has(author)) {
              core.info('Issue author is not an approved content editor: ' + author);
              return;
            }

            const body = issue.body || '';
            const textSection = body.match(/###\s*Текст новости\s*\n+([\s\S]*?)(?=\n###\s|$)/i);
            if (!textSection || !textSection[1].trim() || textSection[1].trim() === '_No response_') {
              core.info('News form is missing required text');
              return;
            }

            const labelName = 'published';
            try {
              await github.rest.issues.getLabel({...context.repo, name: labelName});
            } catch (err) {
              if (err.status !== 404) throw err;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: labelName,
                  color: 'bf2638',
                  description: 'Approved club news shown in the PWA'
                });
              } catch (createErr) {
                if (createErr.status !== 422) throw createErr;
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [labelName]
            });
            core.info('Published news #'+issue.number+' by '+author);
